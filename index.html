<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大潭的交易系统 · OKX 模拟盘</title><meta name="theme-color" content="#0a0e16">
<style>
:root{--bg:#0a0e16;--card:#10162399;--line:#1f2940;--tx:#eef1f7;--mu:#9aa4b8;--dim:#6b7590;--gold:#d8b46a;--up:#34d69f;--dn:#ff6474}
*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(900px 520px at 85% -120px,#1d2848 0%,transparent 65%),radial-gradient(700px 400px at -10% 30%,#15203a55 0%,transparent 70%),var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"PingFang SC","Noto Sans SC","Helvetica Neue",sans-serif;min-height:100vh}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 40px}
header{padding:22px 0 8px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
header h1{font-size:19px;font-weight:600;letter-spacing:.12em}
.warn{font-size:12.5px;color:#ffc04d;font-weight:600;margin-top:2px;letter-spacing:.02em}
.live{font-size:12px;color:var(--mu);display:flex;align-items:center;gap:6px;white-space:nowrap;margin-top:4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 0 3px #34d69f22}.dot.y{background:#f2c14e;box-shadow:0 0 0 3px #f2c14e22}.dot.r{background:var(--dn)}
.rule{height:1px;background:linear-gradient(90deg,var(--gold),transparent);opacity:.5;margin:10px 0 6px}
.blk{padding:26px 0 24px;border-bottom:1px solid var(--line)}
.lab{font-size:13px;letter-spacing:.3em;color:var(--gold);margin-bottom:10px}
.lab i{font-style:normal;font-family:Georgia,"Songti SC",serif;letter-spacing:0;margin-right:8px;opacity:.8}
.s1{font-size:34px;font-weight:600;line-height:1.3;letter-spacing:.01em}
.s1 small{display:block;font-size:15px;font-weight:400;color:var(--mu);margin-top:8px}
.s2{font-size:24px;font-weight:500;line-height:1.45}
.s3{font-size:24px;font-weight:500}.s3 em{font-style:normal;color:var(--gold)}
.prog{margin-top:16px}.prog .tr{height:5px;background:#1c2438;border-radius:5px;overflow:hidden}.prog .fl{height:100%;background:linear-gradient(90deg,#8d6f33,var(--gold));border-radius:5px}
.prog .pl{display:flex;justify-content:space-between;font-size:14px;color:var(--mu);margin-top:8px}
h2{font-size:14px;letter-spacing:.3em;color:var(--mu);font-weight:500;margin:34px 0 14px}
.chart{background:linear-gradient(180deg,#111827,#0d121d);border:1px solid var(--line);border-radius:20px;padding:16px 14px 8px}
.chart .hd{font-size:13px;color:var(--mu);display:flex;justify-content:space-between;margin-bottom:6px}
.hint{height:150px;display:grid;place-items:center;text-align:center;color:var(--mu);font-size:15px;padding:0 10px}
svg{display:block;width:100%}
.lb{border-top:1px solid var(--line)}
.lr{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:16px 2px;border-bottom:1px solid var(--line)}
.lr b{font-size:17px;font-weight:600}.lr .v{font-size:19px;font-weight:600;text-align:right;align-self:center}
.lr p{grid-column:1/-1;font-size:14px;color:var(--mu)}
.lr .tg{font-size:12px;color:var(--dim);margin-left:6px;font-weight:400}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px;transform:rotate(45deg);vertical-align:2px}
details.more{margin-top:30px;border:1px solid var(--line);border-radius:18px;background:#0e131e}
details.more>summary{list-style:none;padding:16px 18px;cursor:pointer;color:var(--gold);font-size:16px;text-align:center;letter-spacing:.1em}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary{border-bottom:1px solid var(--line)}
.dt{padding:6px 18px 18px}
.dt h3{font-size:14px;color:var(--gold);font-weight:500;margin:18px 0 8px;letter-spacing:.1em}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14.5px}.kv span:nth-child(odd){color:var(--mu)}.kv span:nth-child(even){text-align:right}
.note{font-size:12.5px;color:var(--dim);margin-top:6px}
.tk{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;font-size:14px}.tk div{background:#141b2b;border-radius:10px;padding:8px 10px}
.tr1{font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.feed div{font-size:14px;padding:7px 0;border-top:1px solid var(--line)}.feed small{color:var(--dim);margin-right:8px}
.daily{overflow-x:auto;font-size:13px}.daily table{border-collapse:collapse;min-width:100%}.daily td,.daily th{border-bottom:1px solid var(--line);padding:5px 6px;white-space:nowrap;text-align:left}.daily p{margin:6px 0;color:var(--mu)}
footer{text-align:center;color:var(--dim);font-size:12.5px;margin-top:30px;line-height:1.9}
@media(min-width:760px){.s1{font-size:44px}.s2,.s3{font-size:28px}}
</style></head><body><div class="wrap">
<header><div><h1>大潭的交易系统</h1><div class="warn">⚠️ OKX 模拟盘 · 非真实资金</div></div><div class="live"><span class="dot y" id="dot"></span><span id="upd">连接中…</span></div></header>
<div class="rule"></div>
<section class="blk"><div class="lab"><i>Ⅰ</i>结果</div><div class="s1 num" id="r1">正在读取数据…</div></section>
<section class="blk"><div class="lab"><i>Ⅱ</i>现在在干嘛</div><div class="s2" id="r2">—</div></section>
<section class="blk"><div class="lab"><i>Ⅲ</i>接下来</div><div class="s3 num" id="r3">—</div>
 <div class="prog"><div class="tr"><div class="fl" id="pfl" style="width:0"></div></div><div class="pl"><span id="pday">第 — 天 / 共 — 天</span><span id="pend"></span></div></div></section>
<h2>资金走势</h2><div class="chart"><div class="hd"><span>总资金（U）</span><span id="cr"></span></div><div id="ch"></div></div>
<h2>五套策略谁赚谁亏</h2><div class="lb" id="lb"></div>
<details class="more"><summary>展开看详情 ▾</summary><div class="dt" id="dt"></div></details>
<footer>OKX 模拟盘，用的是假钱，不构成投资建议<br>数据每 5 秒自动刷新</footer>
</div>
<script>
const $=id=>document.getElementById(id);let D=null,lastOk=0,src=null;
const C={S1:"#d8b46a",S2:"#7aa7ff",S3:"#34d69f",S4:"#c792ea",S5:"#ff8f6b"};
const ok=v=>v!=null&&v!==""&&!isNaN(v);
const f=(v,d=2)=>ok(v)?(+v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
const sg=(v,d=2)=>ok(v)?(v>0?"+":v<0?"−":"")+f(Math.abs(v),d):"—";
const u=v=>ok(v)?(Math.abs(v)>=10?Math.round(Math.abs(v)):+Math.abs(v).toFixed(2)):"—";
const cls=v=>ok(v)&&v>0?"up":ok(v)&&v<0?"dn":"";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const coin=s=>String(s||"").replace(/-USDT(-SWAP)?/g,"");
const L=s=>s==="long"||s==="多";
const tz=(ts,o)=>new Date(ts).toLocaleString("zh-CN",Object.assign({timeZone:"Asia/Shanghai",hour12:false},o));
const hm=ts=>ts?tz(ts,{hour:"2-digit",minute:"2-digit"}):"—";
const bj=s=>s&&!/[zZ]|[+-]\d\d:?\d\d$/.test(s)?String(s).replace(" ","T")+"+08:00":s;
// 把术语翻成大白话
function plain(t){return String(t??"")
 .replace(/-USDT-SWAP/g,"").replace(/(\d+)H\b/g,"$1小时").replace(/K线/g,"价格蜡烛")
 .replace(/Keltner\s*(突破|通道)?(\(n\d+\))?(突破)?/g,"通道突破").replace(/EMA\s*(\d+)\/(\d+)\s*均线(交叉)?/g,"均线交叉（$1 与 $2 根）").replace(/EMA\s*交叉/g,"均线交叉")
 .replace(/(\d+)?ATR\s*移动止损/g,"跟着涨的认亏线").replace(/\+?\s*ATR\s*止损/g,"+ 按波动幅度设认亏线").replace(/ATR/g,"波动幅度")
 .replace(/(\d+)R\s*平半/g,"赚到风险的 $1 倍先卖一半").replace(/\bR\b/g,"倍风险").replace(/趋势强度\s*ADX/g,"趋势强度").replace(/ADX/g,"趋势强度")
 .replace(/\bn\d+\b/g,"").replace(/None/g,"—").replace(/\bIOC\b/g,"").replace(/止损/g,"认亏线").replace(/入场信号/g,"该出手的信号").replace(/观望/g,"等待").replace(/收盘/g,"收在")}
function how(s){const d=String(s.strategy_desc||s.name||"");
 if(/Keltner|通道/.test(d))return`盯着${coin(s.universe)||"币价"}，价格冲出最近的波动范围就跟进，每 4 小时看一次`;
 if(/EMA|均线/.test(d))return`盯着${coin(s.universe)||"币价"}，短期均价穿过长期均价就跟进，每 4 小时看一次`;
 if(/回踩/.test(d))return`每天挑几个最强势的币，冲高后回落站稳再买入`;
 return plain(d)||"—"}
function nm(s){return plain(s.name||s.sys).replace(/\s*\d+小时$/,"").replace(/（\d+ 与 \d+ 根）/,"")}
function render(){const d=D,sy=d.systems||[],P=sy.flatMap(s=>(s.pos||[]).map(p=>({...p,sys:s.sys}))),TR=d.trades||[];
 // 1
 const p=d.pnl;
 $("r1").innerHTML=!ok(p)?"暂时拿不到结果":Math.abs(p)<0.005?`目前没赚没亏${P.length||TR.length?"":"，还没出手"}<small>起步资金 ${f(d.capital,0)} U，现在 ${f(d.total)} U</small>`
  :`<span class="${cls(p)}">目前${p>0?"赚了 +":"亏了 −"}${u(p)} U（${sg(d.ret_pct)}%）</span><small>起步资金 ${f(d.capital,0)} U，现在 ${f(d.total)} U${ok(d.today_pnl)&&Math.abs(d.today_pnl)>=.005?`；今天${d.today_pnl>0?"赚":"亏"}了 ${u(d.today_pnl)} U`:""}</small>`;
 // 2
 const alive=sy.filter(s=>!/淘汰/.test(s.status||"")).length,dead=sy.length-alive,tdy=d.trades_today;
 let s2;
 if(P.length){const up=P.reduce((a,x)=>a+(+x.upnl||0),0),g={};P.forEach(x=>{const k=`${coin(x.inst)}（${L(x.side)?"赌涨":"赌跌"}）`;g[k]=(g[k]||0)+1});const ks=Object.keys(g),list=ks.length==1?ks[0]:ks.slice(0,3).map(k=>g[k]>1?`${g[k]} 笔 ${k}`:k).join("、");
  s2=`正在拿着 ${ks.length==1?P.length+" 笔 ":""}${list}${ks.length>3?" 等":""}，暂时<span class="${cls(up)}">${Math.abs(up)<.005?"不赚不亏":(up>0?"赚 ":"亏 ")+(Math.abs(up)<.005?"":u(up)+"U")}</span>`}
 else s2=`${alive} 套策略都在等机会，${tdy?`今天已经出手 ${tdy} 次，现在手上没单子`:"今天还没出手"}`;
 if(dead)s2+=`<br><span class="mu" style="font-size:.7em">另有 ${dead} 套亏到上限，已经停下</span>`;
 $("r2").innerHTML=s2;
 // 3
 if(d.next_eval){const t=new Date(bj(d.next_eval)),m=Math.max(0,(t-Date.now())/6e4|0),left=m>=60?`${(m/60).toFixed(m>=120?0:1).replace(/\.0$/,"")} 小时`:`${m} 分钟`;
  $("r3").innerHTML=`下次看盘 <em>${hm(t)}</em>（还有 ${left}）`}else $("r3").textContent="下次看盘时间暂时不知道";
 if(ok(d.days_elapsed)&&ok(d.days_total)){$("pfl").style.width=Math.min(100,d.days_elapsed/d.days_total*100)+"%";$("pday").textContent=`第 ${d.days_elapsed} 天 / 共 ${d.days_total} 天`;
  const pm=String(d.period||"").match(/(\d{4}-\d\d-\d\d)\D+(\d{4}-\d\d-\d\d)/);$("pend").textContent=pm?`${+pm[2].slice(5,7)} 月 ${+pm[2].slice(8)} 日结束`:""}
 chart();
 // board
 const S=[...sy].sort((a,b)=>((b.eq??0)-(a.eq??0)));
 $("lb").innerHTML=S.map(s=>{const pl=ok(s.eq)?s.eq-1000:null,dd=/淘汰/.test(s.status||""),ps=(s.pos||[]).length;
  return`<div class="lr"${dd?' style="opacity:.5"':""}><b><span class="sw" style="background:${C[s.sys]||"#888"}"></span>${esc(nm(s))}<span class="tg">${dd?"已停下":ps?"拿着单子":"等机会"}</span></b>
  <span class="v num ${cls(pl)}">${!ok(pl)?"—":Math.abs(pl)<.005?"没赚没亏":(pl>0?"赚 ":"亏 ")+u(pl)+" U"}</span><p>${esc(how(s))}</p></div>`}).join("")||'<div class="lr"><p>暂时没有策略数据</p></div>';
 details()}
function chart(){const tc=(d=>d.total_curve_ts||d.total_curve||[])(D),cap=D.capital??5000,el=$("ch");
 if(tc.length<2){el.innerHTML='<div class="hint">每小时记一次，第 2 个点出来后开始画曲线</div>';$("cr").textContent="";return}
 const lab=x=>/T/.test(x)?tz(x,{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):x;
 const W=600,H=170,v=tc.map(x=>x[1]),all=[...v,cap],mn=Math.min(...all),mx=Math.max(...all),r=mx-mn||1,y=q=>10+(H-30)*(1-(q-mn)/r),yb=y(cap);
 const line=v.map((q,i)=>((i/(v.length-1))*W).toFixed(1)+","+y(q).toFixed(1)).join(" ");
 el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" height="170"><defs><clipPath id="a"><rect width="${W}" height="${yb}"/></clipPath><clipPath id="b"><rect y="${yb}" width="${W}" height="${H}"/></clipPath></defs>
 <polygon clip-path="url(#a)" fill="#34d69f" fill-opacity=".14" points="0,${yb} ${line} ${W},${yb}"/><polygon clip-path="url(#b)" fill="#ff6474" fill-opacity=".14" points="0,${yb} ${line} ${W},${yb}"/>
 <line x1="0" x2="${W}" y1="${yb}" y2="${yb}" stroke="#d8b46a" stroke-opacity=".5" stroke-dasharray="3 5" vector-effect="non-scaling-stroke"/>
 <polyline clip-path="url(#a)" fill="none" stroke="#34d69f" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round" points="${line}"/><polyline clip-path="url(#b)" fill="none" stroke="#ff6474" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round" points="${line}"/>
 <text x="2" y="${H-3}" fill="#6b7590" font-size="12">${esc(lab(tc[0][0]))}</text><text x="${W-2}" y="${H-3}" fill="#6b7590" font-size="12" text-anchor="end">${esc(lab(tc.at(-1)[0]))}</text></svg>`;
 $("cr").innerHTML=`<span style="color:#d8b46a">┄</span> 起步 ${f(cap,0)}`}
function kv(rows){return`<div class="kv">${rows.map(([a,b])=>`<span>${a}</span><span class="num">${b}</span>`).join("")}</div>`}
function details(){const d=D,el=$("dt"),open=el.closest("details").open;if(!open&&el.dataset.done)return;el.dataset.done=1;
 const sy=d.systems||[],bt=d.backtest;
 let h=`<h3>风险</h3>`+kv([["从最高点掉下来多少（现在）",f(d.total_dd_now,1)+"%"],["最惨的时候掉了多少",f(d.total_mdd,1)+"%"],["单套亏到多少就停下",f(d.dd_limit,0)+"%"],["单套一天最多亏",f(d.day_loss_pct,0)+"%"],["安全规则拦下的下单",(d.rejects_count??"—")+" 次"]]);
 h+=`<h3>赚钱效率</h3>`+kv([["已经落袋的赚亏",sg(d.realized)+" U"],["还没卖、暂时的赚亏",sg(d.unrealized)+" U"],["十次赢几次（胜率）",(d.trades||[]).length?f((d.trades.filter(t=>t.pnl>0).length/d.trades.length)*100,0)+"%":"还没卖过"],["赢一次赚的 ÷ 输一次亏的",f(d.payoff_ratio)],["总赚 ÷ 总亏",f(d.profit_factor)],["最好一笔 / 最差一笔",sg(d.best_trade)+" / "+sg(d.worst_trade)],["交易所收的手续费",f(d.fees)+" U"]]);
 if(bt)h+=`<h3>历史测试参考（用过去行情模拟的成绩）</h3>`+kv([["模拟赚了",sg(bt.ret_pct)+"%"],["模拟时最惨掉了",f(bt.mdd,1)+"%"],["模拟时十次赢几次",f(bt.win,0)+"%"],["模拟交易笔数",(bt.trades??"—")+" 笔"]])+`<div class="note">${esc(plain(bt.period||""))}　${esc(plain(bt.note||"").replace(/S\d/g,m=>m))}</div>`;
 h+=`<h3>每套策略此刻的想法</h3><div class="feed">${sy.map(s=>`<div><small>${esc(nm(s))}</small>${esc(plain(s.doing||"—"))}</div>`).join("")}</div>`;
 const P=sy.flatMap(s=>(s.pos||[]).map(p=>({...p,n:nm(s)})));
 if(P.length)h+=`<h3>手上的单子</h3>`+P.map(p=>`<div class="tr1">${esc(coin(p.inst))}（${L(p.side)?"赌涨":"赌跌"}）· ${esc(p.n)}<br><span class="mu">买入价 ${f(p.entry,4).replace(/\.?0+$/,"")} → 现在 ${f(p.px,4).replace(/\.?0+$/,"")}，认亏线 ${f(p.sl,4).replace(/\.?0+$/,"")}，暂时 <b class="${cls(p.upnl)}">${sg(p.upnl)} U</b></span></div>`).join("");
 const TR=d.trades||[];h+=`<h3>已经卖掉的单子</h3>`+(TR.length?TR.slice(0,30).map(t=>`<div class="tr1">${esc((t.time||"").slice(5,16))} · ${esc(coin(t.inst))}（${L(t.side)?"赌涨":"赌跌"}）<b class="${cls(t.pnl)}" style="float:right">${sg(t.pnl)} U</b><br><span class="mu">买 ${t.entry} → 卖 ${t.exit}${t.why?" · "+esc(plain(t.why)):""}</span></div>`).join(""):'<div class="note">还没卖过，第一笔卖掉后会出现在这里</div>');
 const pr=Object.entries(d.prices||{});if(pr.length)h+=`<h3>币价（今天涨跌）</h3><div class="tk">${pr.map(([k,v])=>`<div>${esc(coin(k))} <span class="num">${v.last}</span> <span class="${cls(v.chg_pct)}">${sg(v.chg_pct)}%</span></div>`).join("")}</div>`;
 const A=d.activity||[];if(A.length)h+=`<h3>最近动态</h3><div class="feed">${A.slice(0,10).map(a=>`<div><small>${esc(String(a.time).slice(11,16))}</small>${esc(plain(a.text))}</div>`).join("")}</div>`;
 const dl=d.daily||[];if(dl.length)h+=`<h3>每日小结</h3>`+dl.slice(0,3).map(x=>`<details><summary class="mu" style="cursor:pointer;padding:6px 0">${esc(x.date)}</summary><div class="daily">${md(plain(x.text))}</div></details>`).join("");
 el.innerHTML=h}
function md(t){const out=[];let tb=null;for(const l of t.split("\n")){if(/^\s*\|/.test(l)){if(/^\s*\|[-\s|:]+\|\s*$/.test(l))continue;const c=l.trim().replace(/^\||\|$/g,"").split("|").map(x=>esc(x.trim()));(tb=tb||[]).push(c)}else{if(tb){out.push("<table>"+tb.map((r,i)=>"<tr>"+r.map(c=>i?`<td>${c}</td>`:`<th>${c}</th>`).join("")+"</tr>").join("")+"</table>");tb=null}const s=l.replace(/^#+\s*/,"").replace(/\*\*/g,"").trim();if(s)out.push(`<p>${esc(s)}</p>`)}}if(tb)out.push("<table>"+tb.map(r=>"<tr>"+r.map(c=>`<td>${c}</td>`).join("")+"</tr>").join("")+"</table>");return out.join("")}
document.querySelector("details.more").addEventListener("toggle",()=>{if(D){$("dt").dataset.done="";details()}});
function status(){const dot=$("dot"),up=$("upd");if(!D){up.textContent=lastOk?"":"连接中…";return}
 const age=(Date.now()-lastOk)/1000,po=D.price_ok,pAge=typeof po==="number"?Date.now()/1000-po:(po?0:1e9),stat=src==="data.json";
 let c="";if(D.price_err&&pAge>30)c="r";else if(age>900||(!stat&&pAge>60))c="y";dot.className="dot "+c;
 const t=D.now?hm(bj(D.now)):"—";up.textContent=age>900?`${(age/60)|0} 分钟前更新`:`${t} 更新`}
async function get(p){const r=await fetch(p,{cache:"no-store"});if(!r.ok)throw 0;const j=await r.json();if(!j||!j.systems)throw 0;return j}
async function load(){const order=src?[src,src==="api/data"?"data.json":"api/data"]:(location.hostname.endsWith("github.io")?["data.json","api/data"]:["api/data","data.json"]);
 for(const p of order){try{D=await get(p);src=p;lastOk=Date.now();render();break}catch(e){}}status()}
