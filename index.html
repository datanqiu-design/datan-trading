<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大潭的交易系统 · OKX 模拟盘</title><meta name="theme-color" content="#0a0e16">
<style>
:root{--bg:#0a0e16;--card:#111725;--line:#1f2940;--tx:#e9edf5;--mu:#97a1b5;--dim:#68728a;--gold:#d8b46a;--up:#2fd39a;--dn:#ff5d6c;--warn:#f2c14e;--blue:#7aa7ff}
*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(1100px 480px at 50% -160px,#1a2340 0%,transparent 70%),var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"SF Pro Text","PingFang SC","Noto Sans SC",sans-serif;min-height:100vh;padding-bottom:30px}
.num{font-family:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}.dim{color:var(--dim)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.flash{animation:fl 1s}@keyframes fl{0%{background:#d8b46a33}100%{background:transparent}}
/* A */
.bar-a{position:sticky;top:0;z-index:20;background:#0a0e16e6;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-a .wrap{min-height:52px;padding-top:6px;padding-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.mark{width:16px;height:16px;border:1px solid var(--gold);transform:rotate(45deg);flex:none;display:grid;place-items:center}.mark i{width:5px;height:5px;background:var(--gold)}
.brand b{font-weight:600;font-size:15px;letter-spacing:.06em;white-space:nowrap}
.warnl{font-size:11.5px;color:#ffc04d;font-weight:600;white-space:nowrap}.sim{font-size:11px;background:#2a3245;color:#c3cad8;padding:1px 7px;border-radius:5px;white-space:nowrap}
.live{font-size:11.5px;color:var(--mu);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 0 3px #2fd39a22}
.dot.y{background:var(--warn);box-shadow:0 0 0 3px #f2c14e22}.dot.r{background:var(--dn);box-shadow:0 0 0 3px #ff5d6c22}
/* B */
.hero{padding:22px 0 4px}
.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--gold)}
.big{font-size:44px;font-weight:300;line-height:1.1;margin:6px 0 4px}.big small{font-size:16px;color:var(--mu);margin-left:4px}
.retl{font-size:20px;font-weight:600;display:flex;gap:14px;flex-wrap:wrap}
.meta{font-size:12px;color:var(--mu);margin-top:6px}
.prog{margin-top:14px}.prog .tr{height:4px;background:#1c2438;border-radius:4px;overflow:hidden}.prog .fl{height:100%;background:linear-gradient(90deg,#8d6f33,var(--gold));border-radius:4px}
.prog .lb{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mu);margin-top:6px}
/* C */
.card{background:linear-gradient(180deg,var(--card),#0e1320);border:1px solid var(--line);border-radius:16px}
.chartc{padding:12px 12px 6px;margin-top:16px;position:relative}
.chartc .hd{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-bottom:4px}
.tip{position:absolute;pointer-events:none;background:#1b2337;border:1px solid #2c3858;border-radius:8px;padding:4px 8px;font-size:11.5px;display:none;white-space:nowrap}
svg{display:block;width:100%}
/* D */
.risk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.risk>div{padding:10px 10px 11px}
.risk label{font-size:11.5px;color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.risk .v{font-size:19px;font-weight:600;display:block;margin-top:2px}
.risk small{font-size:11px;color:var(--dim);display:block}
.mbar{height:5px;background:#1c2438;border-radius:5px;margin-top:6px;position:relative;overflow:visible}
.mbar .fl{height:100%;border-radius:5px}.mbar .mk{position:absolute;top:-3px;width:2px;height:11px;background:#e9edf5;border-radius:1px}
/* term */
.t{border-bottom:1px dotted #6b7690;cursor:pointer}.t:after{content:"ⓘ";font-size:.72em;color:var(--gold);margin-left:2px;vertical-align:.25em}
#pop{visibility:hidden;position:fixed;left:12px;right:12px;bottom:16px;max-width:480px;margin:0 auto;background:#182036;border:1px solid #33406a;border-radius:16px;padding:14px 16px;z-index:50;box-shadow:0 18px 50px #000a;transform:translateY(140%);transition:transform .25s}
#pop.on{transform:none;visibility:visible}#pop b{color:var(--gold);font-size:15px}#pop p{font-size:14px;margin-top:4px;color:#d6dbe6}#pop i{float:right;font-style:normal;color:var(--dim);cursor:pointer;padding:0 4px}
/* sections */
h2{font-size:13px;letter-spacing:.18em;color:var(--mu);font-weight:500;margin:30px 0 12px;display:flex;align-items:center;gap:10px}
h2:before{content:"";width:14px;height:1px;background:var(--gold)}h2 em{font-style:normal;color:var(--dim);letter-spacing:0;margin-left:auto;font-size:12px}
.sc{padding:14px;margin-bottom:10px}
.sc.dead{opacity:.5;filter:grayscale(.8)}.sc.dead .nmline b{text-decoration:line-through}
.nmline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.nmline b{font-size:15px}.nmline span{font-size:13px;color:var(--mu)}
.badge{font-size:11px;padding:1px 8px;border-radius:20px;border:1px solid var(--line);color:var(--mu)}
.badge.on{color:var(--blue);border-color:#7aa7ff66}.badge.p{color:var(--warn);border-color:#f2c14e66}.badge.x{color:var(--dn);border-color:#ff5d6c66}
.row2{display:grid;grid-template-columns:1fr 64px;align-items:center;gap:10px;margin-top:6px}
.row2 .r{font-size:22px;font-weight:600}.row2 small{font-size:12px;color:var(--mu);margin-left:8px}
.row3{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 1fr;gap:10px;margin-top:10px;font-size:12px;color:var(--mu)}
.row3 b{color:var(--tx);font-weight:500}
.doing{font-size:12.5px;color:var(--dim);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.sc summary{list-style:none;font-size:12px;color:var(--gold);cursor:pointer;margin-top:8px}.sc summary::-webkit-details-marker{display:none}
.sub{font-size:12.5px;color:var(--mu);margin-top:8px;display:grid;gap:4px}
.pos{display:grid;gap:12px}
.pc{padding:14px}.pc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pc .top b{font-size:17px}.side{font-size:11.5px;padding:2px 8px;border-radius:6px;margin-left:6px}
.side.L{background:#2fd39a1c;color:var(--up)}.side.S{background:#ff5d6c1c;color:var(--dn)}
.lev{font-size:11px;color:var(--mu);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:4px}.lev.hi{color:var(--warn);border-color:#f2c14e66}
.pc .u{font-size:21px;font-weight:600}
.pc .g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.pc .g label{font-size:11.5px;color:var(--mu);display:block}.pc .g .num{font-size:14px}
.sl .tr{height:6px;border-radius:6px;background:#1c2438;overflow:hidden;margin-top:12px}.sl .fl{height:100%;border-radius:6px}
.sl .lb{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-top:6px}
.wait{border:1px dashed #2a3552;border-radius:16px;padding:22px 16px;text-align:center;background:linear-gradient(135deg,#131a2b,#0f1420)}
.pulse{width:42px;height:42px;margin:0 auto 10px;border-radius:50%;border:1px solid var(--gold);position:relative}
.pulse:after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid var(--gold);animation:p 2.4s ease-out infinite}.pulse i{position:absolute;inset:15px;border-radius:50%;background:var(--gold)}
@keyframes p{to{transform:scale(1.9);opacity:0}}
.wait h3{font-size:16px;font-weight:500}.wait p{font-size:13px;color:var(--mu);margin-top:4px}
.cdc{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;margin-bottom:10px}
.cdc .num{font-size:24px;color:var(--gold)}.cdc p{font-size:12px;color:var(--mu)}
.feed{padding:2px 14px}.fi{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.fi:first-child{border-top:0}.fi small{color:var(--dim);font-size:11.5px;line-height:1.9}
.more{display:block;width:100%;background:none;border:0;border-top:1px solid var(--line);color:var(--gold);padding:10px;font-size:13px;cursor:pointer}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px}
.sum div{background:var(--card);padding:10px}.sum label{font-size:11px;color:var(--mu);display:block;white-space:nowrap}.sum .num{font-size:15px;font-weight:600}
.tc{padding:11px 14px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:3px 10px}
.tc .pn{font-size:16px;font-weight:600;text-align:right}.tc .mu{font-size:12px}
.rt{font-size:11px;padding:1px 6px;border-radius:5px;background:#ffffff0d;text-align:right;justify-self:end}
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.strip::-webkit-scrollbar{display:none}
.chip{flex:none;padding:10px 14px;font-size:13px}.chip b{display:block;font-size:11.5px;color:var(--mu);font-weight:500}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:12px;color:var(--mu);align-items:center}.pool span{border:1px solid var(--line);border-radius:20px;padding:1px 8px}
details.dl{margin-bottom:8px}details.dl summary{padding:11px 14px;cursor:pointer;color:var(--mu);font-size:13.5px}
pre{white-space:pre-wrap;font:12px/1.6 ui-monospace,Menlo,monospace;padding:0 14px 12px;color:#c6cddb}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:18px}
footer{text-align:center;color:var(--dim);font-size:12px;margin-top:34px;line-height:1.9}footer a{color:var(--gold);cursor:pointer}
#gl{display:none;margin-top:12px;text-align:left;padding:6px 14px}#gl.on{display:block}#gl div{font-size:12.5px;padding:6px 0;border-top:1px solid var(--line);color:var(--mu)}#gl div:first-child{border:0}#gl b{color:var(--tx);font-weight:500}
@media(min-width:900px){.big{font-size:60px}.top{display:grid;grid-template-columns:400px 1fr;gap:28px;align-items:start}.top .chartc{margin-top:22px}
 .lbg{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}.lbg .sc{margin:0}.pos{grid-template-columns:1fr 1fr}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:28px}}
</style></head><body>
<div class="bar-a"><div class="wrap"><div class="brand"><div class="mark"><i></i></div><div style="min-width:0"><b>大潭的交易系统</b><div class="warnl">⚠️ <span class="t" data-k="模拟盘">OKX 模拟盘</span> · 非真实资金</div></div></div>

 </div></div></section>

<h2>五套系统排行<em>按赚了百分之几</em></h2><div class="lbg" id="sys"></div>

<div class="grid2"><div>
 <h2>程序在干嘛</h2>

</div>

<script>
const G={"权益":["现在总共有多少钱","本金 + 已赚已亏 + 手上持仓的浮动盈亏"],"余额":["落袋的钱","只算已经平掉的单子"],"本金":["起步资金","每套 1000U，共 5000U"],"收益率":["赚了百分之几","相对本金涨跌多少"],"盈亏":["赚/亏了多少 U","这段时间一共赚或亏的金额"],"浮盈亏":["还没卖，暂时赚/亏","现在平掉能拿到的，价格一动就变"],"已实现":["已经落袋的赚亏","已经平掉的单子算出来的赚亏"],"回撤":["从最高点掉下来多少","比如从 1100 掉到 1045 就是回撤 5%"],"最大回撤":["最惨的时候掉了多少","测试期内从高点到低点最大的跌幅"],"淘汰线":["亏到 10% 就下场","触发后这套系统不再开新单"],"当日暂停":["今天亏够了，先歇着","当天亏损到上限，明天再来"],"止损":["认亏线","价格到这里自动卖掉，防止亏更多"],"移动止损":["把认亏线往上挪","赚钱后上调，锁住一部分利润"],"胜率":["十次赢几次","赚钱的单子 ÷ 全部平掉的单子"],"盈亏比":["赢一次赚的 vs 输一次亏的","平均每笔赚 ÷ 平均每笔亏；大于 1 说明赚多亏少"],"盈利因子":["总赚 ÷ 总亏","大于 1 才算整体赚钱"],"R":["赚了几倍风险","1R = 这笔单子设定的最大可亏金额"],"做多":["买涨","价格涨就赚"],"做空":["买跌","价格跌就赚"],"平仓":["卖掉离场","结束这一笔，盈亏落袋"],"持仓":["手上的单子","程序现在拿着、还没卖掉的单子"],"空仓":["手上没单子，等机会","不是坏事"],"杠杆":["放大倍数","3 倍杠杆：涨跌 1%，盈亏约 3%"],"模拟盘":["假钱练习账户","OKX 提供，规则和真盘一样"],"信号":["程序觉得该出手了","满足规则条件的提示"],"K线":["每 4 小时一根价格蜡烛","程序每 4 小时收盘时检查一次"],"币池":["候选币名单","S5 从这里挑最近涨得最猛的币"],"风控":["安全规则","防止亏太多、下太大"]};
const $=id=>document.getElementById(id);let tot0,D=null,lastOk=0,more=false,prevTxt={};
const C={S1:"#d8b46a",S2:"#7aa7ff",S3:"#2fd39a",S4:"#c792ea",S5:"#ff8f6b"};
const ok=v=>v!=null&&v!==""&&!isNaN(v);
const f=(v,d=2)=>ok(v)?(+v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
const sg=(v,d=2)=>ok(v)?(v>0?"+":v<0?"−":"")+f(Math.abs(v),d):"—";
const ar=v=>ok(v)?(v>0?"▲ ":v<0?"▼ ":""):"";
const cls=v=>!ok(v)?"mu":v>0?"up":v<0?"dn":"mu";
const px=v=>ok(v)?(+v).toLocaleString("en-US",{maximumFractionDigits:v<1?5:v<100?3:2}):"—";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L=s=>s==="long"||s==="多";const cn=s=>String(s||"").replace("-USDT-SWAP","").replace("-USDT","");
const T=(k,txt)=>`<span class="t" data-k="${k}">${txt||G[k][0]}</span>`;
const _=0,ddc=v=>!ok(v)?"#2a3552":v<5?"var(--up)":v<8?"var(--warn)":"var(--dn)";
const day=s=>s?new Date(String(s).slice(0,10)+"T00:00:00+08:00"):null;
function set(id,html){const e=$(id);if(e.innerHTML!==html){const flash=prevTxt[id]!==undefined;e.innerHTML=html;prevTxt[id]=html;if(flash&&e.classList.contains("num")){e.classList.remove("flash");void e.offsetWidth;e.classList.add("flash")}}}
function ddbar(now,max,lim=10){return`<div class="fl" style="width:${ok(now)?Math.min(100,now/lim*100):0}%;background:${ddc(now)}"></div>${ok(max)?`<div class="mk" style="left:calc(${Math.min(100,max/lim*100)}% - 1px)"></div>`:""}`}
function spark(v){if(v.length<2)return'<svg viewBox="0 0 64 24" height="24"><line x1="0" y1="12" x2="64" y2="12" stroke="#2a3552" stroke-dasharray="2 3"/></svg>';const mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1,col=v.at(-1)>1000?"#2fd39a":v.at(-1)<1000?"#ff5d6c":"#97a1b5";return`<svg viewBox="0 0 64 24" height="24" preserveAspectRatio="none"><polyline fill="none" stroke="${col}" stroke-width="1.5" vector-effect="non-scaling-stroke" points="${v.map((y,i)=>(i/(v.length-1)*64).toFixed(1)+","+(2+20*(1-(y-mn)/r)).toFixed(1)).join(" ")}"/></svg>`}
function chart(){const tc=(D.total_curve_ts||[]).map(x=>[hm(x[0]),x[1]]),cap=D.capital??5000,el=$("ch");
 if(tc.length<2){const bc=D.btc_curve||[];el.innerHTML='<div class="empty" style="height:140px;display:grid;place-items:center">每小时记一次，第 2 个点出来后开始画曲线</div>';$("crng").textContent="";return}
 const W=600,H=150,v=tc.map(x=>x[1]),all=[...v,cap],mn=Math.min(...all),mx=Math.max(...all),r=mx-mn||1,y=q=>8+(H-26)*(1-(q-mn)/r),yb=y(cap);
 const pts=v.map((q,i)=>[(i/(v.length-1))*W,y(q)]),line=pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
 el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" height="150" id="csvg"><defs><clipPath id="ca"><rect x="0" y="0" width="${W}" height="${yb}"/></clipPath><clipPath id="cb"><rect x="0" y="${yb}" width="${W}" height="${H}"/></clipPath></defs>
 <polygon clip-path="url(#ca)" fill="#2fd39a" fill-opacity=".16" points="0,${yb} ${line} ${W},${yb}"/><polygon clip-path="url(#cb)" fill="#ff5d6c" fill-opacity=".16" points="0,${yb} ${line} ${W},${yb}"/>
 <line x1="0" x2="${W}" y1="${yb}" y2="${yb}" stroke="#d8b46a" stroke-opacity=".55" stroke-dasharray="3 5" vector-effect="non-scaling-stroke"/>
